spring.application.name=SpaceMonitor

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/space_monitor}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.images.dataset-directory=${IMAGE_DATASET_DIRECTORY:./data/images}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
